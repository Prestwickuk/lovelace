name: Phase 3 Milestone 3.2 acceptance

on:
  push:
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: ci-only-postgres-password
      TEST_DATABASE_URL: postgres://lovelace_test_runner:ci-only-runner-password@127.0.0.1:5432/lovelace_acceptance_test?sslmode=disable
      TEST_APP_DATABASE_URL: postgres://lovelace_app:ci-only-app-password@127.0.0.1:5432/lovelace_acceptance_test?sslmode=disable
      GOTOOLCHAIN: go1.24.0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: true

      - name: Provision isolated test databases and roles
        run: |
          psql -X -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lovelace_migrator LOGIN PASSWORD 'ci-only-migrator-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE lovelace_app LOGIN PASSWORD 'ci-only-app-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE lovelace_test_runner LOGIN PASSWORD 'ci-only-runner-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE DATABASE lovelace_acceptance_test OWNER lovelace_test_runner;
          CREATE DATABASE lovelace_fresh_test OWNER lovelace_migrator;
          CREATE DATABASE lovelace_upgrade_test OWNER lovelace_migrator;
          GRANT CONNECT ON DATABASE lovelace_acceptance_test, lovelace_fresh_test, lovelace_upgrade_test TO lovelace_app, lovelace_test_runner, lovelace_migrator;
          SQL
          for db in lovelace_acceptance_test lovelace_fresh_test lovelace_upgrade_test; do
            owner=lovelace_migrator
            if [ "$db" = lovelace_acceptance_test ]; then owner=lovelace_test_runner; fi
            psql -X -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION btree_gist; ALTER SCHEMA public OWNER TO $owner; GRANT USAGE ON SCHEMA public TO lovelace_app, lovelace_test_runner, lovelace_migrator;"
          done

      - name: Verify formatting, build, and vet
        run: |
          test -z "$(gofmt -l .)"
          go build ./...
          go vet ./...

      - name: Apply all migrations to a fresh PostgreSQL 17 database
        env:
          MIGRATION_DATABASE_URL: postgres://lovelace_migrator:ci-only-migrator-password@127.0.0.1:5432/lovelace_fresh_test?sslmode=disable
        run: go run ./cmd/migrate

      - name: Prepare a populated upgrade from migration 0017
        env:
          MIGRATION_DATABASE_URL: postgres://lovelace_migrator:ci-only-migrator-password@127.0.0.1:5432/lovelace_upgrade_test?sslmode=disable
        run: |
          ./scripts/test-migration-upgrade.sh
          go run ./cmd/migrate
          psql "$MIGRATION_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT 1 FROM schema_migrations WHERE filename = '0018_phase3_3_2_final_acceptance.sql'"
          psql "$MIGRATION_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT 1 FROM audit_logs_effective WHERE resource_id = '30000000-0000-4000-8000-000000000001' AND is_redacted AND before_state->>'status' = 'ANONYMIZED'"
          psql "$MIGRATION_DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT 1 FROM audit_logs WHERE resource_id = '30000000-0000-4000-8000-000000000001' AND before_state->>'guest_email' = 'private@example.test'"

      - name: Run Go tests with required PostgreSQL integration tests
        run: go test -count=1 ./...

      - name: Run race detector with required PostgreSQL integration tests
        run: go test -count=1 -race ./...
