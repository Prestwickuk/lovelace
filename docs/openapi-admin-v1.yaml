      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestID:
      name: guestID
      in: path
      required: true
      schema: { type: string, format: uuid }
    PrefID:
      name: prefID
      in: path
      required: true
      schema: { type: string, format: uuid }
    NoteID:
      name: noteID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommID:
      name: commID
      in: path
      required: true
      schema: { type: string, format: uuid }
    OutboxID:
      name: outboxID
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnquiryID:
      name: enquiryID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TemplateID:
