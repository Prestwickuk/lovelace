<!DOCTYPE html>
<html {{template "html_attrs" .}}>
<head>
{{template "head_assets" .}}
  <title>{{.Title}} — {{.Brand.ConsoleTitle}}</title>
</head>
<body>
  <main class="login-page">
    <div class="login-card error-card" role="alert">
      <div class="login-logo-wrap">
        <img src="{{.Brand.Assets.EmblemLogo}}" alt="{{.Brand.Assets.AltText}}" class="error-emblem">
      </div>
      <div class="mb-1">{{template "status_badge" (dict "Class" "badge-err" "Label" (printf "HTTP %d" .Status))}}</div>
      <h1>{{.Title}}</h1>
      <p class="subtitle mt-2">{{.Message}}</p>
      <div class="mt-4">
        <a href="/" class="btn btn-primary">Return to LOVELACE Console</a>
      </div>
      <div class="login-footer">{{.Brand.FullName}}</div>
    </div>
  </main>
</body>
</html>
